name = "who-said-that"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Comma-separated list of browser origins allowed to create/join rooms.
# "*" is convenient for development; set this to your GitHub Pages origin in
# production, e.g. "https://your-user.github.io".
[vars]
ALLOWED_ORIGINS = "*"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

# SQLite-backed Durable Objects are available on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[observability]
enabled = true
